  - title: Java Code Analysis with Neo4j (Integrated)
    label: java-code-analysis-integrated
    short_description: |
      An integrated AMP that launches Neo4j on Kubernetes and ingests a Java business graph in a single CML Project.
    long_description: |
      Combines the Neo4j Launcher and Java Code Analysis AMPs into a single AMP so that Neo4j and the analysis
      pipeline run in the same CML Project (same Kubernetes namespace). This avoids the cross-namespace
      NetworkPolicy and egress allowlist restrictions that prevent the standalone analysis AMP from reaching
      Neo4j's Internal or External Bolt endpoints in restricted environments such as Cloudera Sandbox.

      Key features:
      - Launch Neo4j 2026.07.1 as a CML Application in the same Project namespace as the analysis job
      - Clone and analyze Java code from any Git repository (defaults to a Spring MVC + MyBatis sample)
      - Extract business, screen, form, SQL, and table nodes; ingest into the co-located Neo4j via Internal Bolt
      - No cross-Project networking required — works on Cloudera Sandbox and other restricted environments
      - Reuse for different repositories by updating GIT_REPO_URL / GIT_REF in Project Settings
