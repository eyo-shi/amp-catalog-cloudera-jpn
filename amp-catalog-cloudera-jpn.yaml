  - title: Merlin
    label: merlin
    short_description: |
      An AMP that runs a natural-language data-analytics multi-agent on Cloudera AI Agent Studio (S3 → Iceberg / summary / CDV dashboard).
    long_description: |
      Cloudera AI Agent Studio 上で動作する自然言語データ分析マルチエージェント。ユーザーが日本語 / 英語で
      問い合わせるだけで、S3 → Iceberg 取り込み、テーブルサマリー生成、Cloudera Data Visualization
      ダッシュボード作成を一気通貫に実行します。3 ペイン Web UI (React + Vite) と FastAPI バックエンドを
      Cloudera AI Workbench Application として配信します。

      Key features:
      - Router / Ingestion / Analytics の 3 Crew を Crew.ai で構成 (Cloudera AI Inference の LLM を LiteLLM 経由で接続)
      - S3 上の Excel / CSV / JSON / Parquet を自動フォーマット判定 → Iceberg テーブルとして登録
      - Trino + Iceberg (Cloudera Data Warehouse) と Cloudera Data Visualization を自然言語で操作
      - セマンティックレイヤに Apache Ossie の YAML を採用、`semantic/` 配下で Git 管理
      - Knox JWT / IDBroker によるエンドユーザー権限パススルー (サービスアカウント特権を持たない)
      - 3 ペイン UI: カタログ / S3 エクスプローラ、テーブル・ダッシュボード・サマリー・SQL・ファイルの結果タブ、SSE ストリーム対応チャット
