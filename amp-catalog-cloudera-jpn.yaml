# Cloudera AI AMP カタログ（日本向け）
# 仕様: https://docs.cloudera.com/machine-learning/cloud/manage-amp/topics/ml-amp-catalog-spec.html
#
# 新しい AMP を追加する場合は entries に以下の形式で追記してください:
#   - title: <カタログに表示するタイトル>
#     label: <一意のラベル（英数字・ハイフン）>
#     short_description: |
#       <タイルに表示する短い説明>
#     long_description: |
#       <詳細説明（タイルクリック時に表示）>
#     image_path: >-
#       <タイル画像の URL（images/ 配下を raw.githubusercontent.com で公開推奨）>
#     tags:
#       - <タグ1>
#       - <タグ2>
#     git_url: "https://github.com/<owner>/<repo>"
#     git_ref: <任意: ブランチ名 / タグ / コミットハッシュ>
#     is_prototype: true
#     is_new: true

name: Cloudera JPN

entries:
  - title: Neo4j Launcher
    label: neo4j-launcher
    short_description: |
      An AMP that deploys Neo4j on Kubernetes and exposes it externally via the CML Application URL.
    long_description: |
      Deploys Neo4j 2026.x as a Kubernetes Deployment and optionally enables APOC / Graph Data Science plugins.
      Exposes Bolt and HTTP externally via LoadBalancer, NodePort, or ClusterIP, with health checks and automatic restarts after startup.

      Key features:
      - Deploy Neo4j 2026.07.1 on Kubernetes
      - Optional automatic enablement of APOC / Graph Data Science plugins
      - External access to Bolt (7687) and Browser (7474)
      - Health checks every 30 seconds with automatic restart
      - Data persistence via shared PVC from the parent Pod (optional)
