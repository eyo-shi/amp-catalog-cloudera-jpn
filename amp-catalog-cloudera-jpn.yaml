  - title: Solomon
    label: solomon
    short_description: |
      An AMP that runs a natural-language data-analytics multi-agent with Neo4j graph ingestion (S3 → Iceberg → Neo4j / summary / CDV dashboard).
    long_description: |
      Cloudera AI Agent Studio 上で動作する自然言語データ分析マルチエージェント。ユーザーが日本語 / 英語で
      問い合わせるだけで、S3 → Iceberg 取り込み、Neo4j グラフDBへのノード・リレーション追加、
      テーブルサマリー生成、Cloudera Data Visualization ダッシュボード作成を一気通貫に実行します。
      3 ペイン Web UI (React + Vite) と FastAPI バックエンドを Cloudera AI Workbench Application として配信します。

